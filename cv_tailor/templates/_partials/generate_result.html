{% if error %}
<div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
  <strong>Error:</strong> {{ error }}
</div>
{% elif version %}
<div class="rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700">
  <strong>Version {{ version.version_number }} generated!</strong>
  <div class="mt-2 flex gap-3">
    <a href="/pdf/{{ version.id }}" target="_blank"
       class="inline-block rounded bg-indigo-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-indigo-700">
      Download PDF
    </a>
    <a href="/version/{{ version.id }}"
       class="inline-block rounded border border-slate-300 px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50">
      View Details
    </a>
    <button onclick="pushToRR({{ version.id }})"
       class="inline-block rounded bg-emerald-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-emerald-700"
       id="push-btn-{{ version.id }}">
      Push to RR
    </button>
  </div>
  <div id="push-result-{{ version.id }}" class="mt-2 hidden"></div>
</div>

<script>
function pushToRR(versionId) {
  const btn = document.getElementById('push-btn-' + versionId);
  const result = document.getElementById('push-result-' + versionId);
  btn.disabled = true;
  btn.textContent = 'Pushing...';
  result.className = 'mt-2';
  result.textContent = '';

  fetch('/push/' + versionId, { method: 'POST' })
    .then(r => r.json())
    .then(d => {
      if (d.error) {
        result.className = 'mt-2 text-red-600';
        result.textContent = 'Error: ' + d.error;
        btn.disabled = false;
        btn.textContent = 'Push to RR';
      } else {
        result.className = 'mt-2 text-green-700';
        result.textContent = 'Pushed to RR (' + d.action + ') — ID: ' + d.id;
        btn.textContent = 'Pushed ✓';
      }
    })
    .catch(e => {
      result.className = 'mt-2 text-red-600';
      result.textContent = 'Error: ' + e;
      btn.disabled = false;
      btn.textContent = 'Push to RR';
    });
}
</script>
{% endif %}
