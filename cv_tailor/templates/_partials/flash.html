{% if flash_message %}
<div id="flash" class="mb-4 px-4 py-3 rounded-lg text-sm {% if flash_type == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}"
     _="on load wait 4s then add .opacity-0 .transition .duration-300 then wait 0.3s then remove me">
  {{ flash_message }}
</div>
{% endif %}
