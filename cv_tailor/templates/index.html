{% extends "base.html" %}
{% block title %}CV Tailor — New{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <h1 class="mb-1 text-xl font-semibold text-slate-800">Tailor Your Resume</h1>
  <p class="mb-6 text-sm text-slate-500">Paste a job description and select your base resume.</p>

  <form id="generate-form"
        hx-post="/generate"
        hx-target="#result-area"
        hx-swap="innerHTML"
        hx-indicator="#spinner"
        class="space-y-5">

    <!-- Base resume selector -->
    <div>
      <label class="mb-1.5 block text-sm font-medium text-slate-700">Base Resume</label>
      <select name="base_resume_id" id="resume-select" required
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        <option value="">Loading resumes…</option>
      </select>
    </div>

    <!-- Job description textarea -->
    <div>
      <label class="mb-1.5 block text-sm font-medium text-slate-700">Job Description</label>
      <textarea name="job_description" required rows="12"
                placeholder="Paste the job description here…"
                class="w-full resize-y rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
    </div>

    <!-- Submit -->
    <div class="flex items-center gap-3">
      <button type="submit"
              class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors">
        Generate Resume
      </button>
      <span id="spinner" class="htmx-indicator text-sm text-slate-500">
        ⏳ Generating… this may take up to 90 seconds
      </span>
    </div>
  </form>

  <!-- Result injection target -->
  <div id="result-area" class="mt-6"></div>
</div>

<script>
// Populate resume selector from /resumes endpoint
(async () => {
  const sel = document.getElementById('resume-select');
  try {
    const r = await fetch('/resumes');
    const data = await r.json();
    sel.innerHTML = '';
    if (data.resumes && data.resumes.length > 0) {
      data.resumes.forEach(rv => {
        const opt = document.createElement('option');
        opt.value = rv.id;
        opt.textContent = rv.title || rv.slug || rv.id;
        sel.appendChild(opt);
      });
    } else {
      sel.innerHTML = '<option value="">No resumes found in Reactive Resume</option>';
    }
  } catch {
    sel.innerHTML = '<option value="">Failed to load resumes</option>';
  }
})();
</script>
{% endblock %}
